<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Passagens</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232a78d6' d='M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f4f3ef;
  --surface: #fcfcfb;
  --surface-2: #f4f3ef;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #75746e;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,.10);
  --series: #2a78d6;
  --accent: #2a78d6;
  --on-accent: #ffffff;
  --good: #006300;
  --bad: #b42f2f;
  --warn: #8a5a00;
  --shadow: 0 1px 2px rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #121211;
    --surface: #1a1a19;
    --surface-2: #232321;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --text-3: #98978f;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,.10);
    --series: #3987e5;
    --accent: #3987e5;
    --good: #0ca30c;
    --bad: #e66767;
    --warn: #fab219;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 64px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 16px; margin: 0; }
button, select, input { font: inherit; color: inherit; }
.muted { color: var(--text-2); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

/* barra do topo */
.top { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.top .sub { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
  padding: 8px 12px; cursor: pointer; min-height: 38px; box-shadow: var(--shadow);
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, th button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn.danger { color: var(--bad); }

.banner {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 10px 14px;
  margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px;
}
.banner.err { border-color: var(--bad); }
.banner .ico { font-weight: 700; }

/* resumo */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.summary { margin-bottom: 20px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 9px 12px; white-space: nowrap; font-size: 14px; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--grid); }
th button { all: unset; cursor: pointer; text-transform: inherit; letter-spacing: inherit; }
td { border-bottom: 1px solid var(--grid); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.summary tbody tr { cursor: pointer; }
.summary tbody tr:hover { background: var(--surface-2); }
.best td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

/* cards */
.cards { display: grid; gap: 16px; }
.card { padding: 18px; }
.card.paused { opacity: .72; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: flex-start; }
.route { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.route .arrow { color: var(--text-3); margin: 0 6px; font-weight: 400; }
.label { font-weight: 500; color: var(--text-2); font-size: 14px; margin-left: 8px; }
.meta { color: var(--text-2); font-size: 13px; margin-top: 3px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--text-2); background: var(--surface-2); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 16px 0; }
.metric { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
.metric .k { font-size: 12px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.metric .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; line-height: 1.15; }
.metric .d { font-size: 13px; color: var(--text-2); margin-top: 2px; min-height: 18px; }
.up { color: var(--bad); font-weight: 600; }
.down { color: var(--good); font-weight: 600; }
.flat { color: var(--text-2); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px; }
.badge .dot { width: 18px; text-align: center; }
.badge.low { color: var(--good); }
.badge.high { color: var(--bad); }

.combos { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.combo { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; text-align: left; font-size: 13px; }
.combo[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.combo b { display: block; font-size: 14px; }
.combo.cheapest::after { content: " ★ menor"; color: var(--good); font-weight: 600; font-size: 12px; }

/* gráfico */
.chart-box { position: relative; margin: 6px 0 4px; }
.chart-title { font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
svg.chart { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
svg.chart text { fill: var(--text-3); font-size: 11px; font-family: inherit; }
svg.chart text.end { fill: var(--text); font-weight: 700; font-size: 12px; }
svg.chart .grid { stroke: var(--grid); stroke-width: 1; }
svg.chart .axis { stroke: var(--axis); stroke-width: 1; }
svg.chart .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.chart .pt { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
svg.chart .cross { stroke: var(--axis); stroke-width: 1; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
  white-space: nowrap; transform: translate(-50%, -100%); z-index: 3;
}
.tip b { font-size: 14px; display: block; }
.empty-chart { color: var(--text-2); font-size: 13px; padding: 18px 0; }

details.sec { margin-top: 10px; }
details.sec > summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 6px 0; }
.tablewrap { overflow-x: auto; border: 1px solid var(--grid); border-radius: 10px; margin-top: 6px; }
.tablewrap td, .tablewrap th { padding: 7px 10px; font-size: 13px; }
.next-day { color: var(--text-3); font-size: 11px; vertical-align: super; }
.card-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--grid); }
.card-foot .btns { display: flex; gap: 6px; flex-wrap: wrap; }

.empty { text-align: center; padding: 40px 20px; }
.empty h2 { margin-bottom: 6px; }

/* dialog */
dialog { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 24px)); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog form { padding: 20px; display: grid; gap: 14px; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--text-2); }
label.f input, label.f select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; min-height: 38px; color: var(--text); width: 100%; }
label.f small { color: var(--text-3); }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.err-text { color: var(--bad); font-size: 13px; min-height: 18px; }
.seg { display: flex; gap: 14px; font-size: 14px; color: var(--text); }
.seg label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 10; width: min(520px, calc(100vw - 24px)); }
.toast { background: var(--text); color: var(--page); padding: 10px 14px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
.toast a { color: inherit; text-decoration: underline; }
code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
ol.steps { margin: 6px 0 0 18px; padding: 0; font-size: 13px; color: var(--text-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 560px) { .route { font-size: 18px; } .metric .v { font-size: 22px; } }
[hidden] { display: none !important; }
label.f.check { gap: 2px; }
label.f.check span { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: 14px; }
label.f.check input { width: auto; min-height: 0; }
.leg-row { display: grid; grid-template-columns: 72px 72px 1fr 40px; gap: 8px; margin-bottom: 8px; }
.leg-row input { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; min-height: 38px; color: var(--text); width: 100%; }
tr.dtl td { padding: 0 10px 8px; }
tr.dtl details > summary { font-size: 12px; cursor: pointer; color: var(--text-2); padding: 2px 0; white-space: normal; }
.dbody { white-space: normal; padding: 6px 0 2px; font-size: 13px; }
.sg { margin: 6px 0 2px; }
.lay { margin: 2px 0 6px 14px; color: var(--text-2); font-size: 12px; }
.bk { margin-top: 8px; font-size: 13px; background: var(--surface-2); padding: 8px 10px; border-radius: 8px; }
.sepbox { margin: 14px 0 4px; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.sepbox .verdict { margin: 8px 0 2px; font-size: 14px; }
.sepbox tfoot td { font-weight: 700; border-top: 1px solid var(--axis); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Passagens</h1>
      <div class="sub" id="updated">Carregando…</div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btn-all" disabled>Buscar agora (todas)</button>
      <button class="btn" id="btn-new" disabled>+ Nova busca</button>
      <button class="btn" id="btn-auth">Entrar</button>
    </div>
  </div>

  <div id="banners"></div>
  <div id="summary"></div>
  <div class="cards" id="cards"></div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<dialog id="dlg-watch">
  <form method="dialog" id="form-watch" autocomplete="off">
    <h2 id="dlg-watch-title">Nova busca</h2>
    <label class="f">Nome (opcional)<input name="label" maxlength="60" placeholder="Ex.: Lisboa no Natal"></label>
    <div class="seg" role="radiogroup" aria-label="Tipo de viagem">
      <label><input type="radio" name="trip" value="round" checked> Ida e volta</label>
      <label><input type="radio" name="trip" value="oneway"> Só ida</label>
      <label><input type="radio" name="trip" value="multi"> Multi-destino</label>
    </div>
    <div id="simple-fields" style="display:grid;gap:14px">
      <div class="row">
        <label class="f">Origem (IATA)<input name="origin" required maxlength="3" minlength="3" pattern="[A-Za-z]{3}" placeholder="GRU" style="text-transform:uppercase"></label>
        <label class="f">Destino (IATA)<input name="destination" required maxlength="3" minlength="3" pattern="[A-Za-z]{3}" placeholder="LIS" style="text-transform:uppercase"></label>
      </div>
      <div class="row">
        <label class="f">Ida<input type="date" name="depart_date" required></label>
        <label class="f" id="return-wrap">Volta<input type="date" name="return_date"></label>
      </div>
    </div>
    <div id="legs-wrap" hidden>
      <div class="muted small" style="margin-bottom:8px">Cada trecho: de onde, para onde e em que dia (de 2 a 5). O destino de um vira a origem do próximo, mas você pode trocar (ex.: voltar por outra cidade).</div>
      <div id="legs"></div>
      <button type="button" class="btn sm" id="leg-add">+ Adicionar trecho</button>
    </div>
    <div class="row">
      <label class="f">Adultos<input type="number" name="adults" min="1" max="9" value="1" required></label>
      <label class="f">Classe
        <select name="cabin"><option value="economy">Econômica</option><option value="premium">Premium</option><option value="business">Executiva</option><option value="first">Primeira</option></select>
      </label>
      <label class="f">Escalas
        <select name="max_stops"><option value="">Qualquer</option><option value="0">Só direto</option><option value="1">Até 1</option><option value="2">Até 2</option></select>
      </label>
    </div>
    <div class="row">
      <label class="f">Datas flexíveis
        <select name="flex_days"><option value="0">Só essa data</option><option value="1">± 1 dia</option><option value="2">± 2 dias</option><option value="3">± 3 dias</option><option value="7">± 7 dias</option></select>
        <small>Cada dia extra é uma consulta a mais.</small>
      </label>
      <label class="f">Coletar automaticamente
        <select name="every_hours">
          <option value="">Nunca (só quando eu pedir)</option>
          <option value="1">A cada 1 hora</option><option value="3">A cada 3 horas</option><option value="6">A cada 6 horas</option>
          <option value="12">A cada 12 horas</option><option value="24" selected>Todo dia</option><option value="48">A cada 2 dias</option><option value="168">Toda semana</option>
        </select>
        <small>O agendador roda de hora em hora e pode atrasar alguns minutos.</small>
      </label>
    </div>
    <label class="f check" id="cmp-wrap"><span><input type="checkbox" name="compare_separate"> Comparar com cada trecho comprado separado (só ida)</span>
      <small>Mostra se comprar os trechos soltos sai mais barato que o pacote. Cada trecho vira mais uma consulta.</small></label>
    <label class="f">Detalhar compra (bagagem, vendedor, faixa de preço)
      <select name="booking_top"><option value="0">Não</option><option value="1" selected>Do voo mais barato</option><option value="3">Dos 3 mais baratos</option><option value="5">Dos 5 mais baratos</option></select>
      <small>Só vale para buscas só de ida (inclui os trechos da comparação). Abre uma página por voo, então é mais lento.</small></label>
    <label class="f" style="display:flex;gap:8px;align-items:center;grid-template-columns:none" id="now-wrap"><input type="checkbox" name="run_now" checked style="width:auto;min-height:0"> Coletar agora, assim que salvar</label>
    <div class="err-text" id="watch-err" role="alert"></div>
    <div class="dlg-actions">
      <button class="btn" type="button" id="watch-cancel">Cancelar</button>
      <button class="btn primary" type="submit" id="watch-save">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-login">
  <form method="dialog" id="form-login" autocomplete="on">
    <h2>Entrar</h2>
    <p class="muted small" style="margin:0">Digite a senha do painel. A sessão vale 7 dias neste navegador.</p>
    <input type="text" name="username" value="painel" autocomplete="username" hidden>
    <label class="f">Senha<input name="password" type="password" autocomplete="current-password" required></label>
    <div class="err-text" id="login-err" role="alert"></div>
    <div class="dlg-actions"><button class="btn primary" type="submit" id="login-go">Entrar</button></div>
  </form>
</dialog>

<script src="app.js" defer></script>
</body>
</html>
